[project]
name = "safety-rag"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Joel Sansana", email = "joelsansana@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.17.0",
    "pydantic>=2.13.5",
    "qdrant-client>=1.19.1",
    "requests>=2.34.2",
    "selectolax>=0.4.11",
    "sentence-transformers>=6.1.0",
    "sse-starlette>=3.4.11",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
safety-rag = "safety_rag:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The playground embeds a single-page app as a Python string; its HTML and
# CSS cannot be wrapped to 80 columns.
"playground.py" = ["E501"]
# These two modules hold LLM prompt templates. Their long lines are prose
# inside string literals, where `# noqa` cannot go and where rewrapping
# would silently change the prompt sent to the model — which would move
# the judge/golden-set numbers this repo reports.
"src/safety_rag/eval/judge.py" = ["E501"]
"src/safety_rag/eval/golden_generator.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
extraPaths = ["scripts"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that hit the real MiniMax API (slow, needs MINIMAX_API_KEY)",
]
addopts = "-m 'not integration'"
pythonpath = ["scripts"]

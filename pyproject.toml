[project]
name = "safety-rag"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Joel Sansana", email = "joelsansana@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
safety-rag = "safety_rag:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]

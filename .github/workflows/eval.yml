name: eval

on:
  pull_request:
    branches: [main]

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      # Fresh Qdrant on every runner — must be populated before eval.
      - name: Start Qdrant
        run: docker run -d --rm -p 6333:6333 --name qdrant-ci qdrant/qdrant

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/collections && break
            sleep 2
          done

      # data/ is gitignored: rebuild the corpus from source in CI.
      # corpus_pins tests (already in the suite) fail loudly if EUR-Lex
      # content drifted and the golden set's hashes went stale.
      - name: Download corpus from EUR-Lex
        run: |
          uv run python scripts/download_corpus.py 32024R1689
          uv run python scripts/download_corpus.py 32022L2555

      - name: Parse and chunk corpus
        run: |
          uv run python - <<'PY'
          from safety_rag.ingestion.eur_lex import parse_eur_lex
          from safety_rag.ingestion.chunker import chunk_records
          import json
          from pathlib import Path
          for celex, name, out in [("32024R1689", "ai_act", "ai_act.jsonl"),
                                   ("32022L2555", "nis2", "nis2.jsonl")]:
              units = parse_eur_lex(f"data/raw/{celex}.html")
              chunks = chunk_records(units)
              path = Path("data/processed") / out
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text("\n".join(json.dumps(c, ensure_ascii=False) for c in chunks) + "\n")
              print(f"{name}: {len(chunks)} chunks -> {path}")
          PY

      - name: Verify corpus pins (golden-set lockstep)
        run: uv run python -m pytest tests/eval/test_corpus_pins.py -q

      - name: Build Qdrant index
        run: uv run python scripts/build_index.py

      - name: Assert index populated (points == chunks)
        run: |
          EXPECTED=$(cat data/processed/*.jsonl | grep -c .)
          ACTUAL=$(curl -sf http://localhost:6333/collections/safety_rag_v1 \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['points_count'])")
          echo "indexed=$ACTUAL expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Eval lepanto tier (retrieval-only, no LLM)
        run: uv run python scripts/run_eval.py --tier lepanto --output eval_run_lepanto.json --summary-only --no-llm

      - name: Eval demo tier (retrieval-only, no LLM)
        run: uv run python scripts/run_eval.py --tier demo --output eval_run_demo.json --summary-only --no-llm

      - name: Compare to main
        run: |
          uv run python scripts/eval_gate.py \
            --current eval_run_lepanto.json \
            --baseline-url https://raw.githubusercontent.com/joelsansana/eu-ai-rag/main/evals/results/baseline.json \
            --metric hit_at_5 \
            --tolerance 0.02
